name: native builds and releases

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: optional release tag, such as v0.1.0; leave empty to use VERSION
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: package version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! -f VERSION || ! -f CMakeLists.txt ]]; then
            echo 'native builds require the prisoncpp source at the repository root' >&2
            exit 1
          fi
          release_tag=""
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            release_tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            release_tag="$REQUESTED_TAG"
          fi
          if [[ -n "$release_tag" ]]; then
            if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || ${#release_tag} -gt 40 ]]; then
              echo 'release tags must use v0.0.0' >&2
              exit 1
            fi
            version="${release_tag#v}"
          else
            version=$(cat VERSION)
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo 'VERSION must contain a version such as 0.1.0' >&2
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ||
                  ( "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ) ]]; then
              release_tag="v$version"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          if [[ -n "$release_tag" ]]; then
            echo "release: $release_tag will publish after all packages succeed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'packages only: releases run on default-branch pushes, version tags and manual runs' >> "$GITHUB_STEP_SUMMARY"
          fi

  unix:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libsdl2-dev libgl-dev libfreetype-dev libpng-dev libjsoncpp-dev libcurl4-openssl-dev dpkg-dev rpm file desktop-file-utils
      - name: macos dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config sdl2-compat freetype libpng jsoncpp curl
          echo "PKG_CONFIG_PATH=$(brew --prefix curl)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: build
        env:
          PRISON_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPRISON_VERSION="$PRISON_VERSION"
          cmake --build build --parallel 2
      - name: package
        run: cpack --config build/CPackConfig.cmake -B build/packages
      - name: appimage
        if: runner.os == 'Linux'
        env:
          PRISON_VERSION: ${{ needs.prepare.outputs.version }}
        run: sh tools/package_appimage.sh build "$PRISON_VERSION"
      - name: upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prisontest-${{ matrix.name }}
          path: |
            build/packages/*.tar.gz
            build/packages/*.deb
            build/packages/*.rpm
            build/packages/*.AppImage
            build/packages/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
          - name: windows-x86
            msystem: MINGW32
            prefix: mingw-w64-i686
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: installer tools
        shell: pwsh
        run: choco install nsis --no-progress --yes
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-pkgconf
            ${{ matrix.prefix }}-SDL2
            ${{ matrix.prefix }}-freetype
            ${{ matrix.prefix }}-libpng
            ${{ matrix.prefix }}-jsoncpp
            ${{ matrix.prefix }}-curl
      - name: build
        env:
          PRISON_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPRISON_VERSION="$PRISON_VERSION"
          cmake --build build --parallel 2
      - name: package
        run: cpack --config build/CPackConfig.cmake -B build/packages
      - name: upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prisontest-${{ matrix.name }}
          path: |
            build/packages/*.zip
            build/packages/*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  packages:
    needs: [prepare, unix, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PACKAGE_TAG: v${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: prisontest-*
          path: artifacts
      - name: collect packages and checksums
        run: python3 tools/prepare_release.py "$PACKAGE_TAG" artifacts release
      - name: upload release bundle
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prisontest-packages
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: download instructions
        env:
          BUNDLE_URL: ${{ steps.bundle.outputs.artifact-url }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          [download all platform packages]($BUNDLE_URL)

          extract the bundle and upload the ten packages in assets/ and SHA256SUMS.txt
          to a release in prisontest/prisontest-client. use notes.md for its description.
          EOF

  release:
    needs: [prepare, packages]
    if: needs.prepare.outputs.release_tag != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: prisontest-packages
          path: release
      - name: publish in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > release/current.json; then
            if [[ "$(jq -r .isDraft release/current.json)" != true ]]; then
              echo 'this release is already published; keeping its packages unchanged'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title "prisontest $RELEASE_TAG" --notes-file release/notes.md
          fi
          gh release upload "$RELEASE_TAG" release/assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
